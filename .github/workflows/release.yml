name: release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - run: node scripts/release-tag.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
